<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIRECTION KZ - Contrôle Direct</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; outline: none; box-sizing: border-box; }
        button { background: #ff9800; color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .user-row { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #ff9800; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-red { background: #f44336; color: white; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .input-mini { background: #333; color: white; text-align: center; font-size: 16px; border: 1px solid #444; }
        .stats-box { display: flex; justify-content: space-between; background: #333; padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 14px; }
        #adminContent { display: none; }
        h1, h2, h3 { color: #ff9800; text-align: center; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h2>Accès Direction KZ</h2>
        <input type="password" id="pinCode" placeholder="Code secret Admin">
        <button onclick="checkPin()">OUVRIR LE PANEL</button>
    </div>

    <div id="adminContent">
        <h1>DIRECTION GÉNÉRALE</h1>
        
        <div class="card">
            <h3>📊 Statistiques Globales</h3>
            <p>Total membres : <span id="totalUsers" style="font-size: 20px; font-weight: bold;">0</span></p>
            <button class="btn-blue" onclick="loadDashboard()">Actualiser la liste Supabase</button>
        </div>

        <div id="userList">Chargement des données...</div>
    </div>

    <script>
        const supabaseUrl = 'https://vvnbdcjhugpdvywtraku.supabase.co';
        const supabaseKey = 'sb_publishable_t_2KwmqR3zNWim6M4xa-EQ_WXyuiQFv';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function checkPin() {
            const pin = document.getElementById('pinCode').value;
            if(pin === "Apodjax1") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadDashboard();
            } else {
                alert("Accès refusé !");
            }
        }

        async function loadDashboard() {
            const { data: users, error } = await _supabase
                .from('profils_promo') // Table correcte
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert("Erreur Supabase : " + error.message);
                return;
            }
            
            document.getElementById('totalUsers').innerText = users.length;
            renderUsers(users);
        }

        function renderUsers(users) {
            const container = document.getElementById('userList');
            container.innerHTML = "";
            
            users.forEach((user) => {
                container.innerHTML += `
                    <div class="user-row">
                        <strong>👤 ${user.username || 'Anonyme'}</strong> (${user.phone || 'Pas de numéro'})
                        
                        <div class="stats-box">
                            <span>💰 Solde: <b>${user.solde || 0} F</b></span>
                            <span>⭐ Inscrits: <b>${user.nombre_filleuls || 0}/15</b></span>
                        </div>
                        
                        <div class="stats-box" style="background:#1a2a3a; margin-bottom:10px;">
                            <span>👥 Filleuls: <b>${user.nombre_filleuls || 0}</b></span>
                            <span>🎁 Bonus Parrain: <b>${user.bonus_parrainage || 0} F</b></span>
                        </div>
                        
                        <input type="number" id="amt-${user.id}" class="input-mini" placeholder="Montant à modifier">
                        
                        <div class="btn-group">
                            <button class="btn-green" onclick="updateField('${user.id}', 'solde', ${user.solde}, 'add')">DÉPÔT</button>
                            <button class="btn-red" onclick="updateField('${user.id}', 'solde', ${user.solde}, 'sub')">RETRAIT</button>
                            <button class="btn-blue" onclick="updateField('${user.id}', 'nombre_filleuls', ${user.nombre_filleuls || 0}, 'add_one')">+1 INSCRI</button>
                            <button class="btn-green" style="background:#2e7d32" onclick="validerBonus15('${user.id}', ${user.nombre_filleuls || 0}, ${user.solde})">PAYER 1200</button>
                        </div>

                        <div class="btn-group">
                            <button class="btn-blue" style="background:#5c6bc0" onclick="updateField('${user.id}', 'nombre_filleuls', ${user.nombre_filleuls || 0}, 'add_one')">+1 FILLEUL</button>
                            <button class="btn-red" style="background:#444;" onclick="deleteUser('${user.id}')">SUPPRIMER</button>
                        </div>
                    </div>`;
            });
        }

        async function updateField(userId, field, currentVal, action) {
            let newVal;
            const inputAmt = parseInt(document.getElementById(`amt-${userId}`).value);

            if (action === 'add') {
                if(!inputAmt) return alert("Montant ?");
                newVal = currentVal + inputAmt;
            } else if (action === 'sub') {
                if(!inputAmt) return alert("Montant ?");
                newVal = (currentVal - inputAmt) < 0 ? 0 : currentVal - inputAmt;
            } else if (action === 'add_one') {
                newVal = (currentVal || 0) + 1;
            }

            const { error } = await _supabase
                .from('profils_promo') // Toujours utiliser profils_promo
                .update({ [field]: newVal })
                .eq('id', userId);

            if(!error) {
                document.getElementById(`amt-${userId}`).value = "";
                loadDashboard();
            }
        }

        async function validerBonus15(userId, nombre_filleuls, solde) {
            if(nombre_filleuls >= 15) {
                const { error } = await _supabase
                    .from('profils_promo') // Toujours utiliser profils_promo
                    .update({ solde: solde + 1200, nombre_filleuls: 0, bonus_parrainage: 1200 })
                    .eq('id', userId);

                if(!error) {
                    alert("Succès : 1200 F ajoutés !");
                    loadDashboard();
                }
            } else {
                alert("Il faut 15 inscriptions !");
            }
        }

        async function deleteUser(userId) {
            if(confirm("Supprimer définitivement ce membre ?")) {
                await _supabase.from('profils_promo').delete().eq('id', userId);
                loadDashboard();
            }
        }
    </script>
</body>
</html>
