<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIRECTION KZ - Contrôle Direct</title>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; outline: none; box-sizing: border-box; }
        button { background: #ff9800; color: black; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .user-row { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #ff9800; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-red { background: #f44336; color: white; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .input-mini { background: #333; color: white; text-align: center; font-size: 16px; border: 1px solid #444; }
        #adminContent { display: none; }
        h1, h2, h3 { color: #ff9800; text-align: center; }
    </style>
</head>
<body>

    <div id="loginSection" class="card">
        <h2>Accès Direction KZ</h2>
        <input type="password" id="pinCode" placeholder="Code secret Admin">
        <button onclick="checkPin()">OUVRIR LE PANEL</button>
    </div>

    <div id="adminContent">
        <h1>DIRECTION GÉNÉRALE</h1>
        
        <div class="card">
            <h3>📊 Statistiques Membres</h3>
            <p>Total inscrits : <span id="totalUsers" style="font-size: 20px; font-weight: bold;">0</span></p>
            <button class="btn-blue" onclick="loadDashboard()">Actualiser la liste</button>
        </div>

        <div id="userList">Chargement des comptes...</div>
    </div>

    <script>
        // Vérification du PIN
        function checkPin() {
            const pin = document.getElementById('pinCode').value;
            if(pin === "Apodjax1") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadDashboard();
            } else {
                alert("Bandit, tu as fumé la peau du maïs ? Accès refusé !");
            }
        }

        // Charger la liste depuis la mémoire locale (Base de données directe)
        function loadDashboard() {
            const users = JSON.parse(localStorage.getItem('BaseUtilisateurs')) || [];
            document.getElementById('totalUsers').innerText = users.length;
            renderUsers(users);
        }

        function renderUsers(users) {
            const container = document.getElementById('userList');
            container.innerHTML = "";
            
            users.forEach((user, index) => {
                container.innerHTML += `
                    <div class="user-row">
                        <strong>👤 Nom : ${user.username || user.nom || 'Anonyme'}</strong><br>
                        📞 Tél : ${user.phone || 'Non renseigné'}<br>
                        💰 Argent : <span style="color:#4CAF50">${user.solde || 0} FCFA</span><br>
                        ⭐ Compteur Inscriptions : <b style="color:#ff9800">${user.compteur || 0} / 15</b>
                        
                        <hr style="border: 0.5px solid #444; margin: 10px 0;">
                        
                        <input type="number" id="amt-${index}" class="input-mini" placeholder="Montant FCFA">
                        
                        <div class="btn-group">
                            <button class="btn-green" onclick="updateMoney(${index}, 'add')">AJOUTER ARGENT</button>
                            <button class="btn-red" onclick="updateMoney(${index}, 'sub')">RETIRER ARGENT</button>
                            <button class="btn-blue" onclick="updateCompteur(${index}, 1)">+1 INSCRIPTION</button>
                            <button onclick="validerBonus15(${index})">🎁 METTRE 1200 FCFA</button>
                        </div>
                        <button class="btn-red" style="margin-top:10px; background:#444;" onclick="deleteUser(${index})">🚫 SUPPRIMER LE TRICHEUR</button>
                    </div>`;
            });
        }

        // Gérer l'argent (Solde)
        function updateMoney(index, type) {
            let users = JSON.parse(localStorage.getItem('BaseUtilisateurs'));
            const amount = parseInt(document.getElementById(`amt-${index}`).value);
            if(!amount) return alert("Écris un montant !");

            if(type === 'add') users[index].solde = (users[index].solde || 0) + amount;
            else users[index].solde = (users[index].solde || 0) - amount;

            save(users);
        }

        // Gérer le compteur (1, 2, 3...)
        function updateCompteur(index, val) {
            let users = JSON.parse(localStorage.getItem('BaseUtilisateurs'));
            users[index].compteur = (users[index].compteur || 0) + val;
            save(users);
        }

        // La règle des 1200 FCFA pour 15 inscriptions
        function validerBonus15(index) {
            let users = JSON.parse(localStorage.getItem('BaseUtilisateurs'));
            if(users[index].compteur >= 15) {
                users[index].solde = (users[index].solde || 0) + 1200;
                users[index].compteur = 0; // On remet à zéro après avoir payé
                alert("1200 FCFA ajoutés ! Compteur remis à zéro.");
                save(users);
            } else {
                alert("Le compteur n'est pas encore à 15 !");
            }
        }

        function deleteUser(index) {
            if(confirm("Supprimer ce compte ?")) {
                let users = JSON.parse(localStorage.getItem('BaseUtilisateurs'));
                users.splice(index, 1);
                save(users);
            }
        }

        function save(data) {
            localStorage.setItem('BaseUtilisateurs', JSON.stringify(data));
            loadDashboard();
        }
    </script>
</body>
</html>
